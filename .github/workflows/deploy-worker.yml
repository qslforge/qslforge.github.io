name: Deploy Worker and app to Cloudflare

# Runs only when the repository variable DEPLOY_ENABLED is "true"
# and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist.
# See docs/setup-github.md, step 5.

on:
  push:
    branches: [main]
    paths: ["web/**", "worker/**", "shared/**", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Apply D1 migrations
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply qslforge --remote
      - name: Deploy Worker with static assets
        working-directory: worker
        run: pnpm exec wrangler deploy
